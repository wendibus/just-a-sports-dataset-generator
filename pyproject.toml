[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-a-sports-dataset-generator"
version = "0.4.0"
description = "Local synthetic sports datasets with COCO annotations for RF-DETR"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "wendibus" }]
dependencies = ["Pillow>=11.3"]

[project.optional-dependencies]
dev = ["ruff", "pyright", "build", "pycocotools", "jsonschema"]

[project.scripts]
sports-dataset = "just_a_sports_dataset_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/just_a_sports_dataset_generator"]

[tool.hatch.build.targets.wheel.force-include]
"licenses/GPL-3.0-or-later.txt" = "just_a_sports_dataset_generator/renderers/blender_worker/COPYING"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
exclude = ["src/just_a_sports_dataset_generator/renderers/blender_worker"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

