[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "just-a-sports-dataset-generator"
version = "0.1.0"
description = "Deterministic planning tools for synthetic sports datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "wendibus" }]
dependencies = []

[project.scripts]
sports-dataset = "just_a_sports_dataset_generator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/just_a_sports_dataset_generator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

